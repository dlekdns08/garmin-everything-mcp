[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin-everything-mcp"
version = "0.1.0"
description = "MCP server exposing the other 70% of Garmin Connect: reflection-generated tools for every garminconnect method garmin_mcp does not wrap."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "dlekdns08" }]
keywords = ["garmin", "garmin-connect", "mcp", "model-context-protocol", "claude", "health", "fitness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "garminconnect==0.3.20",
    # mcp 2.x renamed mcp.server.fastmcp -> mcp.server.mcpserver; cap until ported.
    "mcp>=1.28.1,<2",
]

[project.urls]
Homepage = "https://github.com/dlekdns08/garmin-everything-mcp"
Issues = "https://github.com/dlekdns08/garmin-everything-mcp/issues"

[project.scripts]
garmin-everything-mcp = "garmin_everything_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_everything_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "scripts", "docs", "tests", "README.md", "LICENSE"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
